              name: parent_2_email
              validation: email
              showIf: {}
            - label: 'Numer telefonu'
              name: parent_2_phone
              showIf: {}
      - heading: 'Adres zamieszkania drugiego rodzica'
        label: 'Pierwsza linia adresu'
        name: parent_2_address_1
        description: 'Ulica, numer domu, mieszkania'
        placeholder: 'Przykładowa 34B/12'
      - label: 'Druga linia adresu'
        name: parent_2_address_2
        description: 'Opcjonalnie, w przypadku większości adresów nie jest potrzebna'
        filledIfAny: [parent_2_address_1]
      - label: 'Kod pocztowy'
        name: parent_2_zip_code
        isRow: true
