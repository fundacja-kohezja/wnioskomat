- title: 'Opis doświadczeń'
  displayWithHeadingInSummary: false
  questions:

      # wariant dla dorosłych
      - label: 'Opisz jak przebiegało uświadamianie sobie Twojej tożsamości płciowej'
        name: experience
        type: textarea
        description: "Warto zawrzeć informacje, kiedy rozpoczął się u ciebie ten proces, kiedy nabrał_ś pewności co do swojej tożsamości i czy w trakcie tego procesu doświadczał_ś dysforii."
        showIf: { step: 0, answer: is_underage, valueNot: true }
        extraInfo: |
            :::spoiler Przykład

            Około […] roku życia zaczęło pojawiać się u mnie poczucie rozbieżności pomiędzy płcią przypisaną mi przy urodzeniu a moją tożsamością płciową. Doprowadziło to do wykształcenia się u mnie dysforii, której towarzyszyło obniżenie nastroju. Pewność co do mojej tożsamości płciowej uzyskał_m około […] roku.

            :::
      - label: 'Jestem w terapii hormonalnej'
        name: is_hrt
        type: checkbox
        showIf: { step: 0, answer: is_underage, valueNot: true }
        subquestions:
            - label: 'Od kiedy?'
              name: hrt_since
              type: month
              showIf: {}
      - label: 'Poddano mnie testom psychologicznym'
        name: has_assessment
        type: checkbox
        showIf: { step: 0, answer: is_underage, valueNot: true }
        description: 'Jeśli psycholog, u którego był_ś, pracuje w modelu świadomej zgody, prawdopodobnie nie poddano cię żadnym testom psychologicznym, wówczas możesz pozostawić to pole niezaznaczone.'
      - label: 'Chcę ujawnić sądowi imię, którego używam na co dzień'
        name: has_common_name
        type: checkbox
        showIf: { step: 0, answer: is_underage, valueNot: true }
        subquestions:
            - label: 'Imię, jakim się posługujesz'
              name: common_name
              showIf: {}
      - label: 'W sferze społecznej funkcjonuję zgodnie z moją tożsamością płciową'
        name: areas
        type: radio_vertical
        showIf: { step: 0, answer: is_underage, valueNot: true }
        options:
            some: 'w niektórych obszarach'
            all: 'w większości obszarów'
      # wariant dla dorosłych – koniec

      # wariant dla niepełnoletnich
      - label: 'Opisz jak przebiegało osobie nieletniej uświadamianie swojej tożsamości płciowej'
        name: underage_experience
        type: textarea
        description: "Osoba małoletnia powinna być tu nazywana „Wnioskodawczynią” (gdy zmiana oznaczenia na K) lub „Wnioskodawcą” (gdy zmiana oznaczenia na M)."
        showIf: { step: 0, answer: is_underage }
        extraInfo: |
            :::spoiler Wskazówki, jak wypełnić to pole

            W przypadku osób niepełnoletnich sądy są dużo bardziej skłonne do weryfikowania przedstawianych informacji, dlatego zalecamy szczegółowy opis. Jeśli świadomość tożsamości płciowej pojawiała się już w dzieciństwie, warto to opisać. Warto opisać jak przebiegał proces dojrzewania i czy w jego trakcie występowała dysforia. Istotnym elementem jest to, kiedy osoba małoletnia nabrała pewności co do swojej tożsamości płciowej.

            Przykład:

            > Około [...] roku życia zaczęło pojawiać się u Wnioskodawcy/czyni poczucie rozbieżności pomiędzy płcią przypisaną jej/mu przy urodzeniu a jej/jego tożsamością płciową. Doprowadziło to do wykształcenia się u niej/niego dysforii, której towarzyszyło obniżenie nastroju. Pewność co do swojej żeńskiej/męskiej tożsamości płciowej uzyskał(a) około […] roku.

            Powyższy przykład należy potraktować jako punkt wyjścia do rozbudowania o dużo więcej szczegółów.

            :::
      - heading: 'Osoba małoletnia…'
        label: '…jest w terapii hormonalnej'
        name: is_hrt
        type: checkbox
        showIf: { step: 0, answer: is_underage }
        subquestions:
            - label: 'Od kiedy?'
              name: hrt_since
              type: month
              showIf: {}
      - label: '…była poddawana testom psychologicznym'
        description: 'Można to zweryfikować sprawdzając, czy w opinii psychologicznej jest wzmianka o testach'
        name: has_assessment
        type: checkbox
        showIf: { step: 0, answer: is_underage }
      - label: '…chce podać sądowi imię, którego używa na co dzień'
        name: has_common_name
        type: checkbox
        showIf: { step: 0, answer: is_underage }
        subquestions:
            - label: 'Imię, jakim się posługuje'
              name: common_name
              showIf: {}
      - label: '…w sferze społecznej funkcjonuje zgodnie ze swoją tożsamością płciową'
        name: areas
        type: radio_vertical
        showIf: { step: 0, answer: is_underage }
        options:
            some: 'w niektórych obszarach'
            all: 'w większości obszarów'
      # wariant dla niepełnoletnich – koniec
