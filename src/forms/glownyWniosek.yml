        descLink: ''
        showIf: { step: 0, answer: is_underage }
        extraInfo: |
            :::spoiler Informacje i link do pobrania

            Pobierz: [Ramowe zalecenia dotyczące procesu opieki nad zdrowiem nastoletnich osób transpłciowych (T) i niebinarnych (NB) doświadczających dysforii płciowej — stanowisko panelu ekspertów](/ramowe-zalecenia-nieletni/Ramowe-zalecenia-dotyczace-procesu-opieki-nad-zdrowiem-nastoletnich-osob-transplciowych-i-niebinarnych-2025.pdf){download}

            Dokument jest dostępny na licencji [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/){target=_blank}, [źródło](https://doi.org/10.5603/ep.104289){target=_blank}

            :::
      - heading: 'Dokumenty pomocnicze dla sędziów'
        subheading: 'Zaznacz, które zamierzasz dołączyć – nie są wymagane, ale mocno zalecane, by zwiększyć szansę na szybsze załatwienie sprawy'
