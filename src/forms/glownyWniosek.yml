            Pobierz: [Zalecenia PTS dotyczące opieki nad zdrowiem dorosłych osób transpłciowych](/zalecenia-pts/Grabski_PsychiatrPolOnlineFirstNr187.pdf_____5f7ad3b021cb6.pdf){download}

            Dokument jest dostępny na licencji [CC-BY 4.0](https://creativecommons.org/licenses/by/4.0/){target=_blank}, [źródło](https://doi.org/10.12740/PP/OnlineFirst/125785){target=_blank}

            :::
      - label: 'Publikacja „Postępowania w sprawach o uzgodnienie płci. Przewodnik” wydana przez Rzecznika Praw Obywatelskich'
