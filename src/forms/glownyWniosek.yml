              options:
                  A: 'wydruk z portali społecznościowych'
                  B: 'identyfikator z miejsca pracy'
                  C: 'wydruk z portalu USOS'

- title:
    'Dane osoby małoletniej': { step: 0, answer: is_underage }
    'Dane do wniosku': null
  questions:
      - label: 'PESEL'
        name: pesel
        validation: pesel
        showIf: { step: 0, answer: is_underage }
      - label: 'Twój PESEL'
        name: pesel
        validation: pesel
        showIf: { step: 0, answer: is_underage, valueNot: true }
      - heading: 'Adres zamieszkania'
        subheading: '„Centrum życiowe” osoby niepełnoletniej. To nie musi być jej adres zameldowania. Jeśli jest to niejednoznaczne, np. jest w opiece naprzemiennej, można wybrać które miejsce wskazać jako adres zamieszkania.'
        label: 'Pierwsza linia adresu'
        name: address_1
        description: 'Ulica, numer domu, mieszkania'
        placeholder: 'Przykładowa 34B/12'
        showIf: { step: 0, answer: is_underage }
      - heading: 'Twój adres zamieszkania'
        subheading: 'Wpisz adres, pod którym faktycznie mieszkasz. To nie musi być adres zameldowania. Jeśli jest to niejednoznaczne, np. mieszkasz w akademiku i jeździsz do domu rodzinnego w weekendy, do Ciebie należy decyzja, które z tych miejsc uznasz za swój adres zamieszkania. Na ten adres przyjdzie odpowiedź z sądu, chyba że wyznaczysz pełnomocnika do doręczeń.'
        label: 'Pierwsza linia adresu'
        name: address_1
        description: 'Ulica, numer domu, mieszkania'
        placeholder: 'Przykładowa 34B/12'
        showIf: { step: 0, answer: is_underage, valueNot: true }
      - label: 'Druga linia adresu'
        name: address_2
        description: 'Opcjonalnie, w przypadku większości adresów nie jest potrzebna'
        filledIfAny: [address_1]
      - label: 'Kod pocztowy'
        name: zip_code
        isRow: true
        placeholder: '00-000'
        subquestions:
            - label: 'Miejscowość'
              name: city
      - heading: 'Wybór sądu'
        subheading: 'Sąd rejonowy, do którego złożysz wniosek. Wybierz sąd właściwy dla miejsca zamieszkania osoby małoletniej, czyli adresu wpisanego powyżej. Możesz się upewnić, który sąd jest właściwy, dzwoniąc do Biura Obsługi Interesantów w najbliższym sądzie rejonowym.'
        label: 'Nazwa sądu'
        name: chosen_court
        description: 'Zacznij wpisywać miejscowość, by wyświetlić sugestie – jeśli wybierzesz sąd z listy, adres sądu zostanie wypełniony automatycznie.'
        datalist: courts
        autopopulateCourtAddress: true
        showIf: { step: 0, answer: is_underage }
      - heading: 'Wybór sądu'
        subheading: 'Sąd rejonowy, do którego złożysz wniosek. Wybierz sąd właściwy dla Twojego miejsca zamieszkania, czyli adresu, który wpisał_ś powyżej. Możesz się upewnić, który sąd jest właściwy, dzwoniąc do Biura Obsługi Interesantów w najbliższym sądzie rejonowym.'
        label: 'Nazwa sądu'
        name: chosen_court
        description: 'Zacznij wpisywać miejscowość, by wyświetlić sugestie – jeśli wybierzesz sąd z listy, adres sądu zostanie wypełniony automatycznie.'
        datalist: courts
        autopopulateCourtAddress: true
        showIf: { step: 0, answer: is_underage, valueNot: true }
      - label: 'Adres sądu – ulica i numer'
        name: court_address
        placeholder: 'Przykładowa 34B'
      - label: 'Kod pocztowy'
        name: court_zip_code
        isRow: true
        placeholder: '00-000'
        subquestions:
            - label: 'Miejscowość'
              name: court_city
      - heading: 'Dane kontaktowe'
        label: 'Chcę podać swoje dane kontaktowe'
        name: has_contact_info
        type: checkbox
        description: 'Nie jest to konieczne, ale może ułatwić kontakt z sądem'
        showIf: { step: 0, answer: is_underage, valueNot: true }
        subquestions:
            - label: 'Adres e-mail'
              name: email
              validation: email
              showIf: {}
            - label: 'Numer telefonu'
              name: phone
              showIf: {}
      - heading: 'Pełnomocnik do doręczeń'
        subheading: 'Możesz wyznaczyć osobę, która pod swoim adresem będzie odbierać korenspondecję z sądu.'
        label: 'Chcę mieć pełnomocnika do doręczeń'
        name: has_proxy
        type: checkbox
        subquestions:
            - label: 'Imię i nazwisko'
              name: proxy_name
              showIf: {}
            - label: 'PESEL'
              name: proxy_pesel
              validation: pesel
              showIf: {}
            - label: 'Pierwsza linia adresu'
              name: proxy_address_1
              description: 'Ulica, numer domu, mieszkania'
              placeholder: 'Przykładowa 34B/12'
              showIf: {}
            - label: 'Druga linia adresu'
              name: proxy_address_2
              description: 'Opcjonalnie, w przypadku większości adresów nie jest potrzebna'
              filledIfAny: [proxy_address_1]
              showIf: {}
            - label: 'Kod pocztowy'
              name: proxy_zip_code
              isRow: true
              placeholder: '00-000'
              showIf: {}
              subquestions:
                  - label: 'Miejscowość'
                    name: proxy_city
                    showIf: { answer: has_proxy }
      - heading: 'Dane z aktu urodzenia'
        label: 'Imię/imiona'
        name: birth_name
      - label: 'Nazwisko'
        name: birth_surname
      - label: 'Data urodzenia'
        name: birth_date
        type: date
        validation: underage
        showIf: { step: 0, answer: is_underage, valueNot: true }
      - label: 'Data urodzenia'
        name: birth_date
        type: date
        validation: past
        showIf: { step: 0, answer: is_underage }
      - label: 'Numer aktu'
        name: birth_certificate_id
        description: 'W przypadku odpisu zupełnego aktu numer znajdziesz na górze, jako „oznaczenie aktu…”. W przypadku odpisu skróconego aktu numer znajdziesz na dole, w rubryce „informacje o odpisie”, obok „podpis jest zgodny z treścią aktu o oznaczeniu…”.'
        placeholder: 'XXXXXXX/XX/AU/XXXX/XXXXXX'
      - label: 'Urząd, który wydał dokument'
        name: birth_certificate_issuer
        prefix: 'Urząd Stanu Cywilnego w…'

