- title: 'Dane do pełnomocnictwa'
  description: 'Jeśli chcesz w trakcie postępowania (czyli już po złożeniu właściwego wniosku) wyznaczyć osobę, która będzie w Twoim imieniu odbierać korespondecję z sądu (pod swoim adresem), wypełnij poniższe pola.'
  questions:
      - label: 'Sygnatura sprawy'
        name: case_id
        description: 'Składa się z cyfry rzymskiej, wskazującej na numer wydziału, litery (najczęściej Ns) i numeru porządkowego zapisanego cyframi arabskimi, np. I Ns 100/25'
      - heading: 'Dane pełnomocnika'
        label: 'Imię i nazwisko'
        name: proxy_name
      - label: 'PESEL'
        name: proxy_pesel
        validation: pesel
      - label: 'Pierwsza linia adresu'
        name: proxy_address_1
        description: 'Ulica, numer domu, mieszkania'
        placeholder: 'Przykładowa 34B/12'
      - label: 'Druga linia adresu'
        name: proxy_address_2
        description: 'Opcjonalnie, w przypadku większości adresów nie jest potrzebna'
        filledIfAny: [proxy_address_1]
      - label: 'Kod pocztowy'
        name: proxy_zip_code
        isRow: true
        placeholder: '00-000'
        subquestions:
            - label: 'Miejscowość'
              name: proxy_city
