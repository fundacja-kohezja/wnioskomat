- title: 'Podstawowe informacje'
  description: 'Informacje, które były już podane w głównym wniosku. Jeśli był on generowany we Wnioskomacie, możesz automatycznie wypełnić tę sekcję tymi samymi danymi.'
  questions:
      - label: 'Zmieniasz oznaczenie płci na:'
        name: new_mark
        type: radio_featured
        options:
            K: 'K'
            M: 'M'
      - label: 'Twoja miejscowość'
        name: city
        description: 'Do wstawienia na górze dokumentu, obok bieżącej daty'
      - heading: 'Wybór sądu'
        subheading: 'Wybierz sąd, który prowadzi Twoją sprawę'
        label: 'Znajdź wpisując miejscowość/dzielnicę'
        name: chosen_court
        datalist: courts
      - heading: 'Dane z aktu urodzenia'
        label: 'Imię/imiona'
        name: birth_name
      - label: 'Nazwisko'
        name: birth_surname

- title: 'Dane do wniosku'
  description: 'Ten formularz przyda się jedynie w sytuacji, gdy sąd oddali Twój główny wniosek o sprostowanie aktu urodzenia, co jest bardzo mało prawdopobne. Gdyby się jednak wydarzyło, to możesz tu wystosować prośbę o uzasadnienie, by móc sporządzić odwołanie.'
  questions:
      - label: 'Sygnatura sprawy'
        name: case_id
        description: 'Składa się z cyfry rzymskiej, wskazującej na numer wydziału, litery (najczęściej Ns) i numeru porządkowego zapisanego cyframi arabskimi, np. I Ns 100/25'
      - label: 'Data wydania postanowienia'
        name: issue_date
        type: date
        description: 'Widnieje na postanowieniu w prawym górnym rogu'
      - heading: 'Koszty sądowe'
        subheading: 'Wniosek podlega opłacie 100 zł. Możesz ją wnieść na konto sądu rejonowego, który wydał postanowienie wpisując jako tytuł przelewu „Opłata od wniosku o doręczenie postanowienia z uzasadnieniem w sprawie …”. Możesz też dokonać zakupu znaków sądowych na stronie Ministerstwa Sprawiedliwości.'
        label: 'Składał_m wcześniej wniosek o zwolenienie z kosztów sądowych i uzyskał_m zwolenienie w całości'
        name: is_exempted
        type: checkbox
        description: 'W takiej sytuacji wyjątkowo nie musisz wnosić tej opłaty'
      - heading: 'Adres doręczenia'
        label: 'Od momentu złożenia wniosku zmienił się mój adres do doręczeń'
        name: is_new_address
        type: checkbox
        subquestions:
            - label: 'Pierwsza linia adresu'
              name: new_address_1
              description: 'Ulica, numer domu, mieszkania'
              placeholder: 'Przykładowa 34B/12'
              showIf: {}
            - label: 'Druga linia adresu'
              name: new_address_2
              description: 'Opcjonalnie, w przypadku większości adresów nie jest potrzebna'
              filledIfAny: [new_address_1]
              showIf: {}
            - label: 'Kod pocztowy'
              name: new_zip_code
              isRow: true
              placeholder: '00-000'
              showIf: {}
              subquestions:
                  - label: 'Miejscowość'
                    name: new_city
                    showIf: { answer: is_new_address }
