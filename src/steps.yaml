- title: 'Opis doświadczeń'
  displayWithHeadingInSummary: false
  questions:
      - label: 'Opisz krótko początki Twojego doświadczenia transpłciowości'
        name: experience
        type: textarea
        description: "Przykład: \nOkoło […] roku życia zaczęło pojawiać się u mnie poczucie rozbieżności pomiędzy płcią przypisaną mi przy urodzeniu a moją tożsamością płciową. Doprowadziło to do wykształcenia się u mnie dysforii, której towarzyszyło obniżenie nastroju."
      - label: 'Od kiedy jesteś w terapii hormonalnej?'
        name: hrt_since
        type: month
      - label: 'Poddano mnie badaniom psychologicznym'
        name: has_assessment
        type: checkbox
        description: 'Jeśli psycholog, u którego był_ś, pracuje w modelu świadomej zgody, prawdopodobnie nie poddano cię żadnym badaniom psychologicznym, wówczas możesz odznaczyć to pole.'
      - label: 'Chcę ujawnić sądowi imię, którego używam na co dzień'
        name: has_common_name
        type: checkbox
        subquestions:
            - label: 'Imię, jakim się posługujesz'
              name: common_name
              showIf: {}
      - label: 'W sferze społecznej funkcjonuję zgodnie z moją tożsamością płciową'
        name: areas
        type: radio
        options:
            some: 'w niektórych obszarach'
            all: 'w większości obszarów'
